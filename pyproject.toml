[project]
name = "noctua"
version = "0.1.0"
description = "Agence marketing autonome propulsée par l'abonnement Claude, avec validation humaine obligatoire"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
]

[project.scripts]
agence = "noyau.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["noyau*", "agents*", "app*"]
